name: evo_new_project
description: EVO Player Management and QR Attendance App
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # حفظ البيانات محليًا على الهاتف
  shared_preferences: ^2.3.3

  # صور اللاعبين
  image_picker: ^1.1.2

  # إنشاء QR Codes لكروت اللاعبين
  qr_flutter: ^4.1.0

  # قراءة QR من كاميرا الهاتف
  mobile_scanner: ^6.0.11

  # التقاط صورة للكروت
  screenshot: ^3.0.0

  # إنشاء ملفات PDF
  pdf: ^3.11.1

  # طباعة ومشاركة PDF
  printing: ^5.13.4

  # مشاركة الملفات
  share_plus: ^10.1.3

  # ضغط وفك ضغط الملفات
  archive: ^4.0.2

  # دعم HTML للويب
  universal_html: ^2.2.4

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true